          type: integer
        to_status:
          type: integer
      required:
      - from_status
      - id
      - to_status
      - workflow
    Workspace:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 100
        slug:
          type: string
          readOnly: true
          pattern: ^[-a-zA-Z0-9_]+$
        created_at:
          type: string
          format: date-time
          readOnly: true
        role:
          type: string
          readOnly: true
        plan:
