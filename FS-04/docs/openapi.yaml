          readOnly: true
        role:
          type: string
          readOnly: true
        plan:
          type: string
          readOnly: true
    PriorityEnum:
      enum:
      - low
      - medium
      - high
      - critical
      type: string
      description: |-
        * `low` - Low
        * `medium` - Medium
        * `high` - High
        * `critical` - Critical
    Project:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        key:
