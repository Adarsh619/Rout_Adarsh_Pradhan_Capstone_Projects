      - id
    RoleEnum:
      enum:
      - owner
      - admin
      - member
      - viewer
      type: string
      description: |-
        * `owner` - Owner
        * `admin` - Admin
        * `member` - Member
        * `viewer` - Viewer
    Sprint:
      type: object
      description: |-
        Fields in `fixed_on_update` are set at creation only.

        Moving a status to another workflow, or a sprint / board / comment to another parent, would leave
        the rows that point at it inconsistent (e.g. issues whose status isn't in their project's workflow).
        Sending the current value again is fine; the issue form resends every field on save.
      properties:
        id:
          type: integer
          readOnly: true
        project:
          type: integer
        name:
          type: string
          maxLength: 100
        goal:
          type: string
        start_date:
          type: string
          format: date
          nullable: true
        end_date:
          type: string
          format: date
          nullable: true
        state:
          allOf:
          - $ref: '#/components/schemas/StateEnum'
          readOnly: true
        issue_count:
          type: integer
          readOnly: true
          default: 0
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - id
      - issue_count
      - name
      - project
      - state
    StateEnum:
      enum:
      - planned
      - active
      - closed
      type: string
      description: |-
        * `planned` - Planned
        * `active` - Active
        * `closed` - Closed
    TokenBlacklist:
      type: object
      properties:
        refresh:
          type: string
          writeOnly: true
      required:
      - refresh
    TokenObtainPair:
      type: object
      properties:
        email:
          type: string
          writeOnly: true
        password:
          type: string
          writeOnly: true
        access:
          type: string
          readOnly: true
        refresh:
          type: string
          readOnly: true
