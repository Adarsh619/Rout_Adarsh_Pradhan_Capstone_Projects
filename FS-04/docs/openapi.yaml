            $ref: '#/components/schemas/EventsEnum'
        secret:
          type: string
          readOnly: true
        is_active:
          type: boolean
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - id
      - secret
      - url
    Workflow:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 80
        is_default:
          type: boolean
          readOnly: true
        statuses:
          type: array
          items:
            $ref: '#/components/schemas/WorkflowStatus'
          readOnly: true
        transitions:
          type: array
          items:
            $ref: '#/components/schemas/WorkflowTransition'
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - id
      - is_default
      - name
      - statuses
      - transitions
    WorkflowStatus:
      type: object
      description: |-
        Fields in `fixed_on_update` are set at creation only.

        Moving a status to another workflow, or a sprint / board / comment to another parent, would leave
        the rows that point at it inconsistent (e.g. issues whose status isn't in their project's workflow).
        Sending the current value again is fine; the issue form resends every field on save.
      properties:
        id:
          type: integer
          readOnly: true
        workflow:
          type: integer
        name:
          type: string
          maxLength: 50
        category:
          $ref: '#/components/schemas/CategoryEnum'
        color:
          type: string
          pattern: ^#[0-9a-fA-F]{6}$
          maxLength: 7
        order:
          type: integer
          maximum: 2147483647
          minimum: 0
      required:
      - id
      - name
      - workflow
    WorkflowTransition:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        workflow:
          type: integer
