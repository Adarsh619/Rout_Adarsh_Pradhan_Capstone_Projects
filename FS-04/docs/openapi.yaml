    Attachment:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        issue:
          type: integer
        file:
          type: string
          format: uri
          writeOnly: true
        filename:
          type: string
          readOnly: true
        size:
          type: integer
          readOnly: true
        uploaded_by:
          allOf:
          - $ref: '#/components/schemas/User'
          readOnly: true
        download_url:
          type: string
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - download_url
      - file
      - filename
      - id
      - issue
      - size
      - uploaded_by
    AuditLogAdmin:
      type: object
      description: The admin-only audit log also shows where each change came from.
      properties:
        id:
          type: integer
          readOnly: true
        action:
          type: string
          maxLength: 60
        entity_type:
          type: string
          maxLength: 40
        entity_id:
          type: string
          maxLength: 40
        entity_label:
          type: string
          maxLength: 255
        changes: {}
        actor_email:
          oneOf:
          - type: string
            format: email
            maxLength: 254
          - type: string
            maxLength: 0
        created_at:
          type: string
          format: date-time
          readOnly: true
        ip_address:
          type: string
          nullable: true
      required:
      - action
      - created_at
      - entity_id
      - entity_type
      - id
    Board:
      type: object
      description: |-
        Fields in `fixed_on_update` are set at creation only.

        Moving a status to another workflow, or a sprint / board / comment to another parent, would leave
        the rows that point at it inconsistent (e.g. issues whose status isn't in their project's workflow).
        Sending the current value again is fine; the issue form resends every field on save.
      properties:
        id:
          type: integer
          readOnly: true
        project:
          type: integer
        name:
          type: string
          maxLength: 100
        kind:
          $ref: '#/components/schemas/KindEnum'
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - id
      - name
      - project
    CategoryEnum:
      enum:
      - todo
      - in_progress
      - done
      type: string
      description: |-
        * `todo` - To do
        * `in_progress` - In progress
        * `done` - Done
    Comment:
      type: object
      description: |-
        Fields in `fixed_on_update` are set at creation only.

        Moving a status to another workflow, or a sprint / board / comment to another parent, would leave
        the rows that point at it inconsistent (e.g. issues whose status isn't in their project's workflow).
        Sending the current value again is fine; the issue form resends every field on save.
      properties:
        id:
          type: integer
          readOnly: true
        issue:
          type: integer
        author:
          allOf:
          - $ref: '#/components/schemas/User'
          readOnly: true
        body:
          type: string
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - author
      - body
      - created_at
      - id
      - issue
      - updated_at
    EventsEnum:
      enum:
      - issue.created
      - issue.updated
      - issue.moved
      - issue.deleted
      - comment.created
      - comment.updated
      - comment.deleted
      - attachment.created
      - attachment.deleted
      - project.created
      - project.updated
      - project.deleted
      - board.created
      - board.updated
      - board.deleted
      - sprint.created
      - sprint.updated
      - sprint.deleted
      - sprint.started
      - sprint.completed
      - workflow.created
      - workflow.updated
      - workflow.deleted
      - status.created
      - status.updated
      - status.deleted
      - transition.created
      - transition.deleted
      - member.added
      - member.role_changed
      - member.removed
      - member.left
      type: string
      description: |-
        * `issue.created` - issue.created
        * `issue.updated` - issue.updated
        * `issue.moved` - issue.moved
        * `issue.deleted` - issue.deleted
        * `comment.created` - comment.created
        * `comment.updated` - comment.updated
        * `comment.deleted` - comment.deleted
        * `attachment.created` - attachment.created
        * `attachment.deleted` - attachment.deleted
        * `project.created` - project.created
        * `project.updated` - project.updated
        * `project.deleted` - project.deleted
        * `board.created` - board.created
        * `board.updated` - board.updated
        * `board.deleted` - board.deleted
        * `sprint.created` - sprint.created
        * `sprint.updated` - sprint.updated
        * `sprint.deleted` - sprint.deleted
        * `sprint.started` - sprint.started
        * `sprint.completed` - sprint.completed
        * `workflow.created` - workflow.created
        * `workflow.updated` - workflow.updated
        * `workflow.deleted` - workflow.deleted
        * `status.created` - status.created
        * `status.updated` - status.updated
        * `status.deleted` - status.deleted
        * `transition.created` - transition.created
        * `transition.deleted` - transition.deleted
        * `member.added` - member.added
        * `member.role_changed` - member.role_changed
        * `member.removed` - member.removed
        * `member.left` - member.left
    Issue:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        key:
