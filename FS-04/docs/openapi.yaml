openapi: 3.0.3
info:
  title: TaskFlow API
  version: 1.0.0
  description: 'Multi-tenant project management API. Send `X-Workspace: <slug>` on
    tenant-scoped endpoints.'
paths:
  /api/attachments/:
    get:
      operationId: attachments_list
      description: ModelViewSet that writes an audit entry (and webhook event) for
        create/update/delete.
      parameters:
      - in: query
        name: issue
        schema:
          type: integer
      - name: limit
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - name: offset
        required: false
        in: query
        description: The initial index from which to return the results.
        schema:
          type: integer
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      tags:
      - attachments
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAttachmentList'
          description: ''
    post:
      operationId: attachments_create
      description: ModelViewSet that writes an audit entry (and webhook event) for
        create/update/delete.
      tags:
      - attachments
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Attachment'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Attachment'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Attachment'
          description: ''
  /api/attachments/{id}/:
    get:
      operationId: attachments_retrieve
      description: ModelViewSet that writes an audit entry (and webhook event) for
        create/update/delete.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this attachment.
        required: true
      tags:
      - attachments
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Attachment'
          description: ''
    delete:
      operationId: attachments_destroy
      description: ModelViewSet that writes an audit entry (and webhook event) for
        create/update/delete.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this attachment.
        required: true
      tags:
      - attachments
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
  /api/attachments/{id}/download/:
    get:
      operationId: attachments_download_retrieve
      description: ModelViewSet that writes an audit entry (and webhook event) for
        create/update/delete.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this attachment.
        required: true
      tags:
      - attachments
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Attachment'
          description: ''
  /api/audit-logs/:
    get:
      operationId: audit_logs_list
      description: Every queryset is filtered by the current workspace and every create
        stamps it.
      parameters:
      - in: query
        name: action
        schema:
          type: string
      - in: query
        name: actor_email
        schema:
          type: string
      - in: query
        name: entity_id
        schema:
          type: string
      - in: query
        name: entity_type
        schema:
          type: string
      - in: query
        name: kind
        schema:
          type: string
      - name: limit
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - name: offset
        required: false
        in: query
        description: The initial index from which to return the results.
        schema:
          type: integer
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      - in: query
        name: since
        schema:
          type: string
          format: date
      - in: query
        name: until
        schema:
          type: string
          format: date
      tags:
      - audit-logs
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAuditLogAdminList'
          description: ''
  /api/audit-logs/{id}/:
    get:
      operationId: audit_logs_retrieve
      description: Every queryset is filtered by the current workspace and every create
        stamps it.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this audit log.
        required: true
      tags:
      - audit-logs
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditLogAdmin'
          description: ''
  /api/audit-logs/export/:
    get:
      operationId: audit_logs_export_retrieve
      description: The filtered log as CSV (newest first, up to 10,000 rows). Same
        filters as the list.
      tags:
      - audit-logs
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditLogAdmin'
          description: ''
  /api/auth/logout/:
    post:
      operationId: auth_logout_create
      description: Blacklist the given refresh token so it can't be used again.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenBlacklist'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenBlacklist'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TokenBlacklist'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenBlacklist'
          description: ''
  /api/auth/me/:
    get:
      operationId: auth_me_retrieve
      tags:
      - auth
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: ''
    put:
      operationId: auth_me_update
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/User'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/User'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/User'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: ''
    patch:
      operationId: auth_me_partial_update
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedUser'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedUser'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedUser'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: ''
  /api/auth/password/:
    post:
      operationId: auth_password_create
      description: Change your password. Every refresh token you hold is revoked;
        a fresh pair is returned for this session.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordChange'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PasswordChange'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PasswordChange'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PasswordChange'
          description: ''
  /api/auth/register/:
    post:
      operationId: auth_register_create
      description: Create an account (and optionally a first workspace). Returns JWT
        tokens.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Register'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Register'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Register'
        required: true
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Register'
          description: ''
  /api/auth/token/:
    post:
      operationId: auth_token_create
      description: Email + password → access and refresh tokens.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenObtainPair'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenObtainPair'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TokenObtainPair'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenObtainPair'
          description: ''
  /api/auth/token/refresh/:
    post:
      operationId: auth_token_refresh_create
      description: |-
        Takes a refresh type JSON web token and returns an access type JSON web
        token if the refresh token is valid.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenRefresh'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TokenRefresh'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TokenRefresh'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenRefresh'
          description: ''
  /api/billing/:
    get:
      operationId: billing_retrieve
      description: GET current plan, limits and usage for the workspace.
      tags:
      - billing
      security:
      - jwtAuth: []
      responses:
        '200':
          description: No response body
  /api/billing/checkout/:
    post:
      operationId: billing_checkout_create
      description: Every queryset is filtered by the current workspace and every create
        stamps it.
      tags:
      - billing
      security:
      - jwtAuth: []
      responses:
        '200':
          description: No response body
  /api/billing/mock/complete/:
    post:
      operationId: billing_mock_complete_create
      description: |-
        STRIPE_MOCK only: act as Stripe after the simulated checkout/portal page.

        Sends signed Stripe events through the real webhook handler.
      tags:
      - billing
      security:
      - jwtAuth: []
      responses:
        '200':
          description: No response body
  /api/billing/portal/:
    post:
      operationId: billing_portal_create
      description: Every queryset is filtered by the current workspace and every create
        stamps it.
      tags:
      - billing
      security:
      - jwtAuth: []
      responses:
        '200':
          description: No response body
  /api/billing/stripe-webhook/:
    post:
      operationId: billing_stripe_webhook_create
      description: Receives Stripe events. Signature is verified with STRIPE_WEBHOOK_SECRET.
      tags:
      - billing
      security:
      - {}
      responses:
        '200':
          description: No response body
  /api/boards/:
    get:
      operationId: boards_list
      description: ModelViewSet that writes an audit entry (and webhook event) for
        create/update/delete.
      parameters:
      - name: limit
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - name: offset
        required: false
        in: query
        description: The initial index from which to return the results.
        schema:
          type: integer
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - in: query
        name: project
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      tags:
      - boards
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedBoardList'
          description: ''
    post:
      operationId: boards_create
      description: ModelViewSet that writes an audit entry (and webhook event) for
        create/update/delete.
      tags:
      - boards
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Board'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Board'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Board'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Board'
          description: ''
  /api/boards/{id}/:
    get:
      operationId: boards_retrieve
      description: ModelViewSet that writes an audit entry (and webhook event) for
        create/update/delete.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this board.
        required: true
      tags:
      - boards
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Board'
          description: ''
    put:
      operationId: boards_update
      description: ModelViewSet that writes an audit entry (and webhook event) for
        create/update/delete.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this board.
        required: true
      tags:
      - boards
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Board'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Board'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Board'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Board'
          description: ''
    patch:
      operationId: boards_partial_update
      description: ModelViewSet that writes an audit entry (and webhook event) for
        create/update/delete.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this board.
        required: true
      tags:
      - boards
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedBoard'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedBoard'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedBoard'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Board'
          description: ''
    delete:
      operationId: boards_destroy
      description: ModelViewSet that writes an audit entry (and webhook event) for
        create/update/delete.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this board.
        required: true
      tags:
      - boards
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
  /api/boards/{id}/columns/:
    get:
      operationId: boards_columns_retrieve
      description: |-
        Board columns = statuses of the project's workflow, each with its ordered issues.

        Query params: `sprint=<id>|active|backlog|all`, `assignee=<id>`, `q=<text>`.
        Scrum boards default to the active sprint; Kanban boards default to all issues.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this board.
        required: true
      tags:
      - boards
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Board'
          description: ''
  /api/comments/:
    get:
      operationId: comments_list
      description: ModelViewSet that writes an audit entry (and webhook event) for
        create/update/delete.
      parameters:
      - in: query
        name: issue
        schema:
          type: integer
      - name: limit
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - name: offset
        required: false
        in: query
        description: The initial index from which to return the results.
        schema:
          type: integer
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      tags:
      - comments
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedCommentList'
          description: ''
    post:
      operationId: comments_create
      description: ModelViewSet that writes an audit entry (and webhook event) for
        create/update/delete.
      tags:
      - comments
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Comment'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Comment'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Comment'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Comment'
          description: ''
  /api/comments/{id}/:
    get:
      operationId: comments_retrieve
      description: ModelViewSet that writes an audit entry (and webhook event) for
        create/update/delete.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this comment.
        required: true
      tags:
      - comments
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Comment'
          description: ''
    put:
      operationId: comments_update
      description: ModelViewSet that writes an audit entry (and webhook event) for
        create/update/delete.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this comment.
        required: true
      tags:
      - comments
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Comment'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Comment'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Comment'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Comment'
          description: ''
    patch:
      operationId: comments_partial_update
      description: ModelViewSet that writes an audit entry (and webhook event) for
        create/update/delete.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this comment.
        required: true
      tags:
      - comments
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedComment'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedComment'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedComment'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Comment'
          description: ''
    delete:
      operationId: comments_destroy
      description: ModelViewSet that writes an audit entry (and webhook event) for
        create/update/delete.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this comment.
        required: true
      tags:
      - comments
      security:
      - jwtAuth: []
      responses:
        '204':
          description: No response body
  /api/issues/:
    get:
      operationId: issues_list
      description: ModelViewSet that writes an audit entry (and webhook event) for
        create/update/delete.
      parameters:
      - in: query
        name: assignee
        schema:
          type: integer
      - name: limit
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - name: offset
        required: false
        in: query
        description: The initial index from which to return the results.
        schema:
          type: integer
      - name: ordering
        required: false
        in: query
        description: Which field to use when ordering the results.
        schema:
          type: string
      - in: query
        name: priority
        schema:
          type: string
          enum:
          - critical
          - high
          - low
          - medium
        description: |-
          * `low` - Low
          * `medium` - Medium
          * `high` - High
          * `critical` - Critical
      - in: query
        name: project
        schema:
          type: integer
      - name: search
        required: false
        in: query
        description: A search term.
        schema:
          type: string
      - in: query
        name: sprint
        schema:
          type: integer
      - in: query
        name: status
        schema:
          type: integer
      - in: query
        name: type
        schema:
          type: string
          enum:
          - bug
          - epic
          - story
          - task
        description: |-
          * `task` - Task
          * `bug` - Bug
          * `story` - Story
          * `epic` - Epic
      tags:
      - issues
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedIssueList'
          description: ''
    post:
      operationId: issues_create
      description: ModelViewSet that writes an audit entry (and webhook event) for
        create/update/delete.
      tags:
      - issues
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Issue'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Issue'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Issue'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Issue'
          description: ''
  /api/issues/{id}/:
    get:
      operationId: issues_retrieve
      description: ModelViewSet that writes an audit entry (and webhook event) for
        create/update/delete.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this issue.
        required: true
      tags:
      - issues
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Issue'
          description: ''
    put:
      operationId: issues_update
      description: ModelViewSet that writes an audit entry (and webhook event) for
        create/update/delete.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this issue.
        required: true
      tags:
      - issues
