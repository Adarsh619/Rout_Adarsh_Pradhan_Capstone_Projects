; Runs every TaskFlow process in the one live container. All output goes to the container log.
; Programs running as `app` need HOME=/home/app: supervisord keeps root's HOME, and on an SSL database
; connection libpq treats "permission denied" on /root/.postgresql as fatal.
[supervisord]
nodaemon=true
user=root
logfile=/dev/null
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid

[program:redis]
command=redis-server --bind 127.0.0.1 --port 6379 --save "" --appendonly no --maxmemory 48mb --maxmemory-policy noeviction
user=app
environment=HOME="/home/app",USER="app"
priority=10
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:stripe-mock]
command=/usr/local/bin/stripe-mock -http-port 12111
user=app
environment=HOME="/home/app",USER="app"
priority=10
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

; One process with threads keeps memory low on a 512 MB instance.
[program:web]
command=gunicorn config.wsgi:application --bind 127.0.0.1:8000 --workers 1 --threads 4 --timeout 60 --access-logfile -
directory=/app
user=app
environment=HOME="/home/app",USER="app"
priority=20
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

; Worker with embedded beat (-B) and the solo pool: one process instead of three.
[program:celery]
command=celery -A config worker -B --pool=solo -l info --schedule /tmp/celerybeat-schedule
directory=/app
user=app
environment=HOME="/home/app",USER="app"
priority=30
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:nginx]
command=nginx -c /tmp/nginx.conf -g "daemon off;"
priority=40
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

; Creates the demo companies on first start; skips them when they already exist.
[program:seed]
command=python manage.py seed_demo --force
directory=/app
user=app
environment=HOME="/home/app",USER="app"
priority=50
autorestart=false
startsecs=0
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true
