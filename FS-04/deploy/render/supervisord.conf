; Runs every TaskFlow process in the one live container. All output goes to the container log.
; Programs run as `app` with HOME=/home/app: supervisord would otherwise keep root's HOME, which `app` can't read.
[supervisord]
nodaemon=true
user=root
logfile=/dev/null
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid

[program:redis]
command=redis-server --bind 127.0.0.1 --port 6379 --save "" --appendonly no --maxmemory 48mb --maxmemory-policy noeviction
user=app
environment=HOME="/home/app",USER="app"
priority=10
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:stripe-mock]
command=/usr/local/bin/stripe-mock -http-port 12111
user=app
environment=HOME="/home/app",USER="app"
priority=10
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

; The Node.js API, with the BullMQ worker and its schedule in the same process (EMBEDDED_WORKER=true):
; one process instead of two keeps memory low on a 512 MB instance.
[program:api]
command=node dist/index.js
directory=/app
user=app
environment=HOME="/home/app",USER="app",PORT="8000"
priority=20
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:nginx]
command=nginx -c /tmp/nginx.conf -g "daemon off;"
priority=40
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

; Creates the demo companies on first start; skips them when they already exist.
[program:seed]
command=node dist/scripts/seed-demo.js --force
directory=/app
user=app
environment=HOME="/home/app",USER="app"
priority=50
autorestart=false
startsecs=0
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true
