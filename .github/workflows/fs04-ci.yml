# Lives at the REPO ROOT: .github/workflows/fs04-ci.yml (GitHub only reads workflows from there).
# The project itself is in the FS-04/ subfolder, so every path below is prefixed with FS-04/.
name: FS-04 CI/CD

on:
  push:
    branches: [main]
    # A version tag (v1.0.0) publishes and verifies that release, then creates a GitHub Release.
    # GitHub doesn't apply the path filter to tag pushes.
    tags: ["v*"]
    paths: ["FS-04/**", ".github/workflows/fs04-ci.yml"]
  pull_request:
    paths: ["FS-04/**", ".github/workflows/fs04-ci.yml"]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Least privilege by default; the publish and release jobs ask for more themselves.
permissions:
  contents: read

jobs:
  backend:
    name: Backend · lint + tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: taskflow
          POSTGRES_USER: taskflow
          POSTGRES_PASSWORD: taskflow
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U taskflow" --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
      stripe-mock:
        image: stripe/stripe-mock:v0.206.0  # same version as docker-compose.yml
        ports: ["12111:12111"]
    env:
      DATABASE_URL: postgres://taskflow:taskflow@localhost:5432/taskflow
      REDIS_URL: redis://localhost:6379/0
      DJANGO_SECRET_KEY: ci-secret
      STRIPE_MOCK_URL: http://localhost:12111
    defaults:
      run:
        working-directory: FS-04/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: FS-04/backend/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check .
      - name: Check migrations are committed
        run: python manage.py makemigrations --check --dry-run
      - name: Tests (fails if backend coverage drops below 90%)
        run: pytest --cov-report=xml --junitxml=test-results.xml --cov-fail-under=90
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-test-results
          path: |
            FS-04/backend/test-results.xml
            FS-04/backend/coverage.xml

  frontend:
    name: Frontend · lint + tests + build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: FS-04/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: FS-04/frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  # Starts the whole Docker Compose stack the way a user would and checks it answers, on every push and
  # pull request: catches a broken Dockerfile, nginx config or migration before any image is published.
  smoke:
    name: Docker Compose · smoke test
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: FS-04
    steps:
      - uses: actions/checkout@v4
      - name: Start the stack (built from source)
        run: |
          cp .env.example .env
          docker compose up -d --build --wait --wait-timeout 300
      - name: Check the app, API, proxy, admin and a sign-up
        run: bash scripts/smoke-test.sh http://localhost:3000
      - name: Show logs if anything failed
        if: failure()
        run: docker compose logs --no-color --tail 200

  # Deploys the tested build as versioned images to GitHub Container Registry, for amd64 and arm64
  # (Intel/AMD PCs and servers, Apple Silicon, ARM cloud servers).
  publish:
    name: Publish images to GHCR
    needs: [smoke]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        image: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image name (registry paths must be lowercase)
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}/fs04-${{ matrix.image }}" >> "$GITHUB_ENV"
      # main → latest + sha-<commit>; tag v1.2.3 → 1.2.3 + 1.2 + latest + sha-<commit>
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-,format=short
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
          labels: |
            org.opencontainers.image.title=TaskFlow ${{ matrix.image }}
            org.opencontainers.image.description=TaskFlow (FS-04) multi-tenant project management, ${{ matrix.image }}
      - uses: docker/build-push-action@v6
        with:
          context: ./FS-04/${{ matrix.image }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=fs04-${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=fs04-${{ matrix.image }}

  # Proves the deployed images work: pulls exactly what was just published (nothing is built here),
  # starts it with docker-compose.release.yml and runs the same smoke test. This is the GitHub
  # deployment record ("release" environment) shown on the repository's Deployments page.
  verify-release:
    name: Verify published release
    needs: [publish]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: release
      url: ${{ github.server_url }}/${{ github.repository }}/tree/main/FS-04#run-the-released-version-no-build
    defaults:
      run:
        working-directory: FS-04
    steps:
      - uses: actions/checkout@v4
      - name: Start the published images (no build)
        run: |
          cp .env.example .env
          export TASKFLOW_TAG="sha-${GITHUB_SHA::7}"
          echo "Running release images tagged $TASKFLOW_TAG"
          docker compose -f docker-compose.release.yml pull
          docker compose -f docker-compose.release.yml up -d --wait --wait-timeout 300
      - name: Check the app, API, proxy, admin and a sign-up
        run: bash scripts/smoke-test.sh http://localhost:3000
      - name: Show logs if anything failed
        if: failure()
        run: docker compose -f docker-compose.release.yml logs --no-color --tail 200

  # On a version tag (v1.0.0), creates the GitHub Release with the two files needed to run it.
  release:
    name: GitHub Release
    needs: [verify-release]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Create the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}"
          cat > notes.md <<NOTES
          TaskFlow (FS-04) ${GITHUB_REF_NAME}: tested, smoke-tested and verified by GitHub Actions.

          **Images** (linux/amd64 and linux/arm64)
          - \`${IMAGE}/fs04-backend:${VERSION}\`
          - \`${IMAGE}/fs04-frontend:${VERSION}\`

          **Run this release on your computer** (Docker Desktop is the only requirement)

          This page is a download, not a hosted website: http://localhost opens only after you start the release.

          1. Put \`docker-compose.release.yml\` and \`taskflow.env.example\` (below) in one folder and rename \`taskflow.env.example\` to \`.env\`.
          2. In \`.env\`, set \`TASKFLOW_TAG=${VERSION}\`. If port 3000 is already in use, also set \`FRONTEND_PORT=3002\`.
          3. In that folder (PowerShell, Terminal or any shell): \`docker compose -f docker-compose.release.yml up -d --wait\`
          4. Demo data: \`docker compose -f docker-compose.release.yml exec backend python manage.py seed_demo\`
          5. Open http://localhost:3000 (or your \`FRONTEND_PORT\`) and sign in as \`owner@acme.test\` / \`demo12345\`.

          Full Windows and macOS/Linux steps: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/tree/${GITHUB_REF_NAME}/FS-04#run-the-released-version-no-build
          NOTES
          # GitHub renames uploaded files that start with a dot, so the env template gets a plain name.
          cp FS-04/.env.example taskflow.env.example
          gh release create "$GITHUB_REF_NAME" FS-04/docker-compose.release.yml taskflow.env.example \
            --title "TaskFlow ${GITHUB_REF_NAME}" --notes-file notes.md --verify-tag

  # Optional live-server deploy (Level B). Switched off until a server exists: set the repository
  # variable DEPLOY_ENABLED=true and the deploy secrets. Until then it is skipped and records nothing.
  deploy-server:
    name: Deploy to server
    needs: [verify-release]
    if: vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    steps:
      - name: Trigger deploy hooks (Render / Railway / any platform with a deploy webhook)
        env:
          BACKEND_DEPLOY_HOOK: ${{ secrets.BACKEND_DEPLOY_HOOK }}
          FRONTEND_DEPLOY_HOOK: ${{ secrets.FRONTEND_DEPLOY_HOOK }}
        run: |
          if [ -z "$BACKEND_DEPLOY_HOOK" ]; then
            echo "::error::DEPLOY_ENABLED is true but BACKEND_DEPLOY_HOOK isn't set."
            exit 1
          fi
          curl -fsS -X POST "$BACKEND_DEPLOY_HOOK"
          # A configured frontend hook that fails must fail the job, not be swallowed.
          if [ -n "$FRONTEND_DEPLOY_HOOK" ]; then curl -fsS -X POST "$FRONTEND_DEPLOY_HOOK"; fi
