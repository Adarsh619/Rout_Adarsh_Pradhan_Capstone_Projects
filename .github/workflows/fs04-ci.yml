# Lives at the REPO ROOT: .github/workflows/fs04-ci.yml (GitHub only reads workflows from there).
# The project itself is in the FS-04/ subfolder, so every path below is prefixed with FS-04/.
name: FS-04 CI/CD

on:
  push:
    branches: [main]
    paths: ["FS-04/**", ".github/workflows/fs04-ci.yml"]
  pull_request:
    paths: ["FS-04/**", ".github/workflows/fs04-ci.yml"]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend · lint + tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: taskflow
          POSTGRES_USER: taskflow
          POSTGRES_PASSWORD: taskflow
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U taskflow" --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
      stripe-mock:
        image: stripe/stripe-mock:latest
        ports: ["12111:12111"]
    env:
      DATABASE_URL: postgres://taskflow:taskflow@localhost:5432/taskflow
      REDIS_URL: redis://localhost:6379/0
      DJANGO_SECRET_KEY: ci-secret
      STRIPE_MOCK_URL: http://localhost:12111
    defaults:
      run:
        working-directory: FS-04/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: FS-04/backend/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check .
      - name: Check migrations are committed
        run: python manage.py makemigrations --check --dry-run
      - name: Tests (fails if backend coverage drops below 90%)
        run: pytest --cov-report=xml --junitxml=test-results.xml --cov-fail-under=90
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-test-results
          path: |
            FS-04/backend/test-results.xml
            FS-04/backend/coverage.xml

  frontend:
    name: Frontend · lint + tests + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: FS-04/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: FS-04/frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  docker:
    name: Build & push images
    needs: [backend, frontend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Lowercase repo name
        run: echo "IMAGE_PREFIX=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
      - uses: docker/build-push-action@v6
        with:
          context: ./FS-04/backend
          push: true
          tags: ${{ env.IMAGE_PREFIX }}/fs04-backend:latest,${{ env.IMAGE_PREFIX }}/fs04-backend:${{ github.sha }}
          cache-from: type=gha,scope=fs04-backend
          cache-to: type=gha,mode=max,scope=fs04-backend
      - uses: docker/build-push-action@v6
        with:
          context: ./FS-04/frontend
          push: true
          tags: ${{ env.IMAGE_PREFIX }}/fs04-frontend:latest,${{ env.IMAGE_PREFIX }}/fs04-frontend:${{ github.sha }}
          cache-from: type=gha,scope=fs04-frontend
          cache-to: type=gha,mode=max,scope=fs04-frontend

  deploy:
    name: Deploy
    needs: docker
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Trigger deploy hooks (Render / Railway / any platform with a deploy webhook)
        env:
          BACKEND_DEPLOY_HOOK: ${{ secrets.BACKEND_DEPLOY_HOOK }}
          FRONTEND_DEPLOY_HOOK: ${{ secrets.FRONTEND_DEPLOY_HOOK }}
        run: |
          if [ -z "$BACKEND_DEPLOY_HOOK" ]; then
            echo "::notice::No deploy hook secrets configured — images are pushed to GHCR; skipping deploy."
            exit 0
          fi
          curl -fsS -X POST "$BACKEND_DEPLOY_HOOK"
          [ -n "$FRONTEND_DEPLOY_HOOK" ] && curl -fsS -X POST "$FRONTEND_DEPLOY_HOOK" || true
